[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cusscut"
version = "0.1.0"
description = "CLI для автоматической цензуры речи в аудио и видео"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.2,<2", "pydub>=0.25,<1"]

[tool.setuptools]
py-modules = ["cli", "processor"]

[project.scripts]
cusscut = "cli:main"
ccut = "cli:main"

[tool.pytest.ini_options]
addopts = "-q"

