name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cusscut
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import tomllib

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          base_version = tomllib.loads(text)["project"]["version"]
          publish_version = f"{base_version}.post{os.environ['GITHUB_RUN_NUMBER']}"
          text = re.sub(r'(?m)^version = "[^"]+"$', f'version = "{publish_version}"', text, count=1)
          path.write_text(text, encoding="utf-8")
          print(f"Publishing version {publish_version}")
          PY
          python -m build

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
